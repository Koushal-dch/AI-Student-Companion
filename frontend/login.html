<!DOCTYPE html>

<html>

<head>

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="auth-container">

    <h1>AI Student Companion</h1>





    <input
      type="text"
      id="username"
      placeholder="Username"
    />





    <input
      type="password"
      id="password"
      placeholder="Password"
    />





    <button id="loginBtn">
      Login
    </button>





    <button id="signupBtn">
      Signup
    </button>





    <p id="authMessage"></p>

  </div>





  <script src="login.js"></script>

</body>

</html>
